<!DOCTYPE html>
<html>
    <body>
        <h1>Sense if room temperature is too hot</h1>
        <div>
            <form>
                <label>Temperature that is too hot:</label>
                <input type="range" name="temperature" id="temperature" min="20" max="35" value="27">
                <output>Not hot</output>
            </form>
        </div>
    </body>
</html>
